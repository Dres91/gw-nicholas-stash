name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version after building, for example v1.0.0 (leave empty to only build)"
        required: false
        default: ""

# The build never gets a write token. Only the release job at the bottom does, and only when a release is being published.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure (32-bit, because Guild Wars is 32-bit)
      run: cmake -S . -B build -G "Visual Studio 18 2026" -A Win32

    - name: Build
      run: cmake --build build --config Release

    - name: Collect the dll and its checksum
      shell: bash
      run: |
        mkdir -p out
        cp build/Release/NicholasStash.dll LICENSE THIRD-PARTY-NOTICES.md out/
        cd out
        sha256sum NicholasStash.dll | tee NicholasStash.dll.sha256

    - name: Upload build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: NicholasStash
        path: out/

  release:
    # Only for a pushed version tag (v...), or a manual run with a version filled in. Publishes exactly the files the
    # build job made, and never replaces a release.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download the build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: NicholasStash
        path: out

    - name: Publish release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        set -euo pipefail
        version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
        if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Version '$version' must look like v1.2.3." >&2
          exit 1
        fi
        if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release $version already exists; not replacing it." >&2
          exit 1
        fi
        cd out
        sha256sum -c NicholasStash.dll.sha256
        hash=$(cut -d' ' -f1 NicholasStash.dll.sha256)
        gh release create "$version" NicholasStash.dll NicholasStash.dll.sha256 LICENSE THIRD-PARTY-NOTICES.md \
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nicholas Stash $version" \
          --notes "Built automatically by GitHub from this release's source (commit ${GITHUB_SHA:0:7}) ([build log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).

        SHA256 of NicholasStash.dll: \`$hash\`

        Please review the code and report anything odd in Issues."
