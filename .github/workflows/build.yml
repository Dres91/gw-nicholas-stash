name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure (32-bit, because Guild Wars is 32-bit)
      run: cmake -S . -B build -G "Visual Studio 18 2026" -A Win32

    - name: Build
      run: cmake --build build --config Release

    - name: Collect the dll and its checksum
      shell: bash
      run: |
        mkdir -p out
        cp build/Release/NicholasStash.dll out/
        cd out
        sha256sum NicholasStash.dll | tee NicholasStash.dll.sha256

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: NicholasStash
        path: out/

    - name: Publish release (only for tags that start with v)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          out/NicholasStash.dll
          out/NicholasStash.dll.sha256
